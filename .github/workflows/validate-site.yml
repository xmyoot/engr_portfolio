name: Validate portfolio
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.2'
          bundler-cache: true
      - run: bundle exec jekyll build --strict_front_matter
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-site
          path: _site

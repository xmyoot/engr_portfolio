---
layout: default
---
<article class="project-detail">
  <header>
    <h1>{{ page.title }}</h1>
    {% if page.date %}<p class="date">{{ page.date | date: "%b %-d, %Y" }}</p>{% endif %}
  </header>

  {% if page.thumbnail %}
    <img src="{{ page.thumbnail | relative_url }}" alt="{{ page.title }}" class="project-hero"/>
  {% endif %}

  <div class="project-content">
    {{ content }}
  </div>

  <p><a href="{{ '/' | relative_url }}">&larr; Back</a></p>
</article>
